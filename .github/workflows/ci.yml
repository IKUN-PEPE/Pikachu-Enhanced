name: Pikachu-Enhanced CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-tests:
    name: Code Quality, PSR-12, & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, curl, mbstring, gd, zip, bcmath
          tools: phpcs, phpstan, phpunit
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check PSR-12 Coding Standards
        run: phpcs --standard=PSR12 src/ tests/ inc/bootstrap.php

      - name: Run PHPStan Static Analysis
        run: phpstan analyse --level=5 src/ inc/bootstrap.php

      - name: Run Automated Test Suite
        run: php tests/run_tests.php

      - name: Execute Python Quality Audit
        run: python3 test_runner.py

  docker-verification:
    name: Container Build & Compose Healthcheck
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Web Application Image
        run: docker build -t pikachu-web:test .

      - name: Verify Multi-Container Orchestration
        run: |
          docker compose up -d
          sleep 15
          docker compose ps
          curl -f http://localhost:8765/index.php || exit 1
          docker compose down -v
